title: Articles
route: "{{ if content_language == 'fr' }}{{ french_url }}{{ else }}/articles/{{ slug }}{{ /if }}"
template: article
layout: false
date: true
date_behavior:
  future: public
  past: public
sort_dir: desc
sort_by: date
revisions: false
inject:
  view_model: App\ViewModels\SiteViewModel
